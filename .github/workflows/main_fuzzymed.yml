# ──────────────────────────────────────────────────────────
# FuzzyDx — CI Pipeline
# ──────────────────────────────────────────────────────────
# Vercel maneja el deploy automáticamente desde GitHub.
# Este workflow solo valida que el build del frontend
# no esté roto antes de mergear a main.

name: CI — Build check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
